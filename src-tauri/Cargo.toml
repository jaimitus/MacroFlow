[package]
name = "macroflow"
version = "1.7.0"
description = "Low-latency Windows automation engine (visual AutoHotkey alternative)"
authors = ["MacroFlow"]
edition = "2021"
rust-version = "1.77"



[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri uses the system WebView2 (already on Windows 11) instead of shipping a
# whole Chromium, which is what keeps the memory footprint and binary tiny.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
chrono = "0.4"
enigo = "0.1"
arboard = "3"
screenshots = "0.8"
keyring = "2"
image = "0.25"
base64 = "0.22"
reqwest = { version = "0.12", features = ["blocking", "json"] }

# ── Aggressive size + memory optimization for the shipped .exe ──
[profile.release]
opt-level = "s"      # optimize for size; use "z" to squeeze harder
lto = true           # link-time optimization removes dead code across crates
codegen-units = 1    # better optimization at the cost of compile time
panic = "abort"      # no unwinding tables → smaller binary, less RAM
strip = true         # strip symbols from the final binary
incremental = false
